  <circle cx="538" cy="98" r="24" fill="#f2faf7"/>
  <path d="M528 98l7 7 14-15" fill="none" stroke="#17a398" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e8edf6">
    <rect x="496" y="154" width="84" height="6" rx="3"/>
    <rect x="496" y="174" width="84" height="6" rx="3"/>
    <rect x="496" y="194" width="84" height="6" rx="3"/>
    <rect x="496" y="214" width="84" height="6" rx="3"/>
  </g>
  <g>
    <rect x="496" y="154" width="76" height="6" rx="3" fill="#8b5cf6"/>
    <rect x="496" y="174" width="62" height="6" rx="3" fill="#4c7df0"/>
    <rect x="496" y="194" width="54" height="6" rx="3" fill="#e0932f"/>
    <rect x="496" y="214" width="40" height="6" rx="3" fill="#17a398"/>
  </g>

  <!-- small accents -->
  <circle cx="244" cy="150" r="4" fill="#d7dded"/>
  <circle cx="460" cy="150" r="4" fill="#d7dded"/>
  <path d="M606 56l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#eceff8"/>
